<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WTK Mock Payment</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
    .card { background: #1e293b; padding: 1.5rem 1.75rem; border-radius: 12px; max-width: 420px; width: 92%; }
    h1 { margin: 0 0 .5rem; font-size: 1.25rem; color: #22c55e; }
    code { display: block; font-size: .85rem; color: #94a3b8; margin: .25rem 0; word-break: break-all; }
    button { margin-top: 1rem; width: 100%; padding: .75rem; border: 0; border-radius: 8px; background: #22c55e; color: #052e16; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .msg { margin-top: .75rem; font-size: .9rem; }
    .ok { color: #86efac; } .err { color: #fca5a5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Mock Payment Gateway</h1>
    <p style="color:#94a3b8;font-size:.9rem;margin:0 0 1rem">Simulasi VA / Snap — klik bayar untuk settlement.</p>
    <code id="oid">orderId: —</code>
    <code id="pid">paymentId: —</code>
    <button id="btn" type="button">Bayar &amp; Settle</button>
    <div id="msg" class="msg"></div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const orderId = q.get("orderId") || "";
    const paymentId = q.get("paymentId") || "";
    document.getElementById("oid").textContent = "orderId: " + (orderId || "—");
    document.getElementById("pid").textContent = "paymentId: " + (paymentId || "—");
    document.getElementById("btn").onclick = async () => {
      const btn = document.getElementById("btn");
      const msg = document.getElementById("msg");
      if (!orderId) { msg.className = "msg err"; msg.textContent = "orderId kosong"; return; }
      btn.disabled = true;
      try {
        const res = await fetch("/api/payments/simulate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ orderId, paymentId }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) {
          msg.className = "msg ok";
          msg.textContent = "Lunas. E-ticket dikirim async. Silakan tutup tab ini.";
        } else {
          msg.className = "msg err";
          msg.textContent = data.error || "Gagal";
          btn.disabled = false;
        }
      } catch (e) {
        msg.className = "msg err";
        msg.textContent = e.message;
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
