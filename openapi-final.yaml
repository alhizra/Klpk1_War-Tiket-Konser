openapi: 3.0.3
info:
  title: API Squad — War Tiket Konser (Klpk1)
  version: 2.0.0
  description: |
    **DIBEKUKAN (draft siap P4)** — salinan v1 + penanda freeze.
    Setelah instruktur verifikasi, hanya perubahan aditif yang diizinkan.
    Data domain: K-pop Korea (BTS Busan, SEVENTEEN KSPO, NewJeans Incheon, IU Jamsil).
  x-frozen: true
  x-frozen-date: "2026-08-19"
  x-baseurl-rules:
    rateLimitPerMinute: 60
    defaultPageSize: 20
    maxPageSize: 50

servers:
  - url: http://localhost:8080
    description: Gateway (isi baseurl artefak di sini saat deploy)

# Implementasi path sama dengan openapi.yaml v1 — lihat file itu untuk schema penuh.
# File ini menandai status beku untuk artefak openapi-final.

paths:
  /health:
    get:
      summary: Health
      responses:
        "200": { description: OK }
  /events:
    get:
      summary: Daftar event (page/size)
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
      responses:
        "200": { description: OK }
        "429": { description: Rate limit }
  /events/{id}:
    get:
      summary: Detail + seats + sisa live
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: OK }
        "404": { description: Not found }
  /orders:
    post:
      summary: Order tiket anti-oversell
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, qty]
              properties:
                eventId: { type: integer }
                qty: { type: integer, minimum: 1, maximum: 4 }
                seatCodes:
                  type: array
                  items: { type: string }
      responses:
        "201": { description: Created }
        "409": { description: Quota exhausted (valid business reject) }
        "429": { description: Rate limit }
