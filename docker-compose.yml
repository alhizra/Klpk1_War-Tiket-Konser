services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wtk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wtk}
      POSTGRES_DB: ${POSTGRES_DB:-wtk}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wtk} -d ${POSTGRES_DB:-wtk}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Backend monolit = event + ticket + static web
  # Scale: docker compose up -d --scale api=3
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-wtk}:${POSTGRES_PASSWORD:-wtk}@postgres:5432/${POSTGRES_DB:-wtk}
      REDIS_URL: redis://redis:6379
      DEFAULT_QUOTA: ${DEFAULT_QUOTA:-500}
      RATE_LIMIT: ${RATE_LIMIT:-10000}
      RATE_WINDOW_SEC: ${RATE_WINDOW_SEC:-60}
      RESET_TOKEN: ${RESET_TOKEN:-dev-reset}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENT_AUTO_CAPTURE: ${PAYMENT_AUTO_CAPTURE:-1}
      PAYMENT_TTL_MIN: ${PAYMENT_TTL_MIN:-15}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-0}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-WTK Ticket <noreply@wtk-ticket.local>}
    volumes:
      - outbox-mail:/app/data/outbox-mail
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["node", "src/worker.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wtk}:${POSTGRES_PASSWORD:-wtk}@postgres:5432/${POSTGRES_DB:-wtk}
      REDIS_URL: redis://redis:6379
      PAYMENT_TTL_MIN: ${PAYMENT_TTL_MIN:-15}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-0}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-WTK Ticket <noreply@wtk-ticket.local>}
    volumes:
      - outbox-mail:/app/data/outbox-mail
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  outbox-mail:
