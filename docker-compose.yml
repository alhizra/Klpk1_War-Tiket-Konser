services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wtk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wtk}
      POSTGRES_DB: ${POSTGRES_DB:-wtk}
    ports:
      # Codespace / dev lokal: npm start bisa ke localhost:5432
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wtk} -d ${POSTGRES_DB:-wtk}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Backend monolit = event + ticket + static web
  # Scale: docker compose up -d --scale api=3
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-wtk}:${POSTGRES_PASSWORD:-wtk}@postgres:5432/${POSTGRES_DB:-wtk}
      REDIS_URL: redis://redis:6379
      DEFAULT_QUOTA: ${DEFAULT_QUOTA:-500}
      RATE_LIMIT: ${RATE_LIMIT:-10000}
      RATE_WINDOW_SEC: ${RATE_WINDOW_SEC:-60}
      RESET_TOKEN: ${RESET_TOKEN:-dev-reset}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["node", "src/worker.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wtk}:${POSTGRES_PASSWORD:-wtk}@postgres:5432/${POSTGRES_DB:-wtk}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
