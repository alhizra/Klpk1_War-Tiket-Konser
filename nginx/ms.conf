# Gateway Microservices :8080
# event :3001 | ticket :3002 | payment :3003 | notification :3004

server {
    listen 80;
    resolver 127.0.0.11 valid=5s ipv6=off;

    location /health {
        default_type application/json;
        return 200 '{"ok":true,"gateway":"ms"}';
    }

    # event-service
    location /v1/events {
        set $upstream event;
        proxy_pass http://$upstream:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ticket-service
    location /v1/tickets {
        set $upstream ticket;
        proxy_pass http://$upstream:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/v1/events/[^/]+/seats$ {
        set $upstream ticket;
        proxy_pass http://$upstream:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    # payment-service
    location /v1/login {
        set $upstream payment;
        proxy_pass http://$upstream:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location /v1/payments {
        set $upstream payment;
        proxy_pass http://$upstream:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Authorization $http_authorization;
    }

    location /v1/catalog {
        set $upstream payment;
        proxy_pass http://$upstream:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    # notification
    location /v1/notifications {
        set $upstream notification;
        proxy_pass http://$upstream:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    # per-service health (ops)
    location /svc/event/health {
        set $upstream event;
        proxy_pass http://$upstream:3001/health;
    }
    location /svc/ticket/health {
        set $upstream ticket;
        proxy_pass http://$upstream:3002/health;
    }
    location /svc/payment/health {
        set $upstream payment;
        proxy_pass http://$upstream:3003/health;
    }
    location /svc/notification/health {
        set $upstream notification;
        proxy_pass http://$upstream:3004/health;
    }
}
