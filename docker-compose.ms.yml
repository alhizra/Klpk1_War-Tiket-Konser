# Microservices stack — War Tiket (materi Modul 2)
# Jalankan: docker compose -f docker-compose.ms.yml up --build
# Gateway: http://localhost:8080

services:
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  event:
    build: ./services/event
    environment:
      PORT: "3001"
      DB_PATH: /data/event.db
    volumes:
      - event-data:/data
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  ticket:
    build: ./services/ticket
    environment:
      PORT: "3002"
      EVENT_URL: http://event:3001
      DB_PATH: /data/ticket.db
    volumes:
      - ticket-data:/data
    depends_on:
      event:
        condition: service_healthy
    expose:
      - "3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  payment:
    build: ./services/payment
    environment:
      PORT: "3003"
      EVENT_URL: http://event:3001
      TICKET_URL: http://ticket:3002
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-wtk-dev-secret-ganti}
      DB_PATH: /data/payment.db
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENT_AUTO_CAPTURE: ${PAYMENT_AUTO_CAPTURE:-1}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-0}
    volumes:
      - payment-data:/data
    depends_on:
      redis:
        condition: service_healthy
      event:
        condition: service_healthy
      ticket:
        condition: service_healthy
    expose:
      - "3003"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  notification:
    build: ./services/notification
    environment:
      PORT: "3004"
      REDIS_URL: redis://redis:6379
      DB_PATH: /data/notification.db
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-0}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-WTK Ticket <noreply@wtk-ticket.local>}
    volumes:
      - notification-data:/data
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "3004"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/ms.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      event:
        condition: service_healthy
      ticket:
        condition: service_healthy
      payment:
        condition: service_healthy
      notification:
        condition: service_healthy
    restart: unless-stopped

volumes:
  event-data:
  ticket-data:
  payment-data:
  notification-data:
